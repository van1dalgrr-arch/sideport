name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        target:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-name: sideport
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-name: sideport
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-name: sideport
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-name: sideport

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/sideport

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/sideport

      - name: Rename binary for upload
        run: cp target/${{ matrix.target }}/release/sideport sideport-${{ matrix.target }}

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: sideport-${{ matrix.target }}
          generate_release_notes: true
          draft: false
          prerelease: false
